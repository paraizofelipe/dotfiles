#################################
#          Backend
#################################

# Backend to use: "xrender" or "glx".
# GLX backend is typically much faster but depends on a sane driver.
backend = "xrender";

# Enable/disable VSync.
vsync = false;

#################################
#       General Settings
#################################

# Daemonize process. Fork to background after initialization.
daemon = true;

# Specify refresh rate of the screen. If not specified or 0, picom will
# try detecting this with X RandR extension.
# refresh-rate = 0;

# Use EWMH '_NET_ACTIVE_WINDOW' to determine currently focused window,
# rather than listening to 'FocusIn'/'FocusOut' event.
use-ewmh-active-win = true;

# Unredirect all windows if a full-screen opaque window is detected,
# to maximize performance for full-screen windows.
unredir-if-possible = true;

# Detect '_NET_WM_WINDOW_TYPE' on client windows.
detect-client-opacity = false;

# Use 'WM_TRANSIENT_FOR' to group windows, and consider windows
# in the same group focused at the same time.
detect-transient = true;

# GLX backend: Avoid using stencil buffer, useful if you don't have a stencil buffer.
# glx-no-stencil = true;

# GLX backend: Avoid rebinding pixmap on window damage.
# glx-no-rebind-pixmap = true;

# Use X Sync fence to sync clients' draw calls. Needed on nvidia-drivers with GLX backend for some users.
xrender-sync-fence = true;

# GLX backend: Copy unmodified regions from front buffer instead of redrawing them all.
# Useful with --glx-swap-method, as well.
# glx-copy-from-front = false;

# Disable the use of damage information.
use-damage = true;

# Set the log level. Possible values are:
#  "trace", "debug", "info", "warn", "error"
log-level = "warn";

detect-rounded-corners = true;

#################################
#           Shadows
#################################

# Enabled client-side shadows on windows.
shadow = true;

# Exclude conditions for shadows.
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'"
  # "_GTK_FRAME_EXTENTS@:c"
];

#################################
#           Fading
#################################

# Fade windows in/out when opening/closing and when opacity changes,
# unless no-fading-openclose is used.
fading = false;

# Exclude conditions for fading.
fade-exclude = [
  "name = 'Notification'",
  "class_g = 'slop'"
];

#################################
#   Transparency / Opacity
#################################

# Opacity of inactive windows. (0.1 - 1.0, defaults to 1.0)
inactive-opacity = 1.0;

# Opacity of window titlebars and borders. (0.1 - 1.0, disabled by default)
frame-opacity = 1.0;

# Let inactive opacity set by -i override the '_NET_WM_WINDOW_OPACITY' values of windows.
inactive-opacity-override = false;

# Default opacity for active windows. (0.0 - 1.0, defaults to 1.0)
active-opacity = 1.0;

# Dim inactive windows. (0.0 - 1.0, defaults to 0.0)
inactive-dim = 0;

# Specify a list of conditions of windows that should never be considered focused.
focus-exclude = [ ];

#################################
#           Corners
#################################

# Sets the radius of rounded window corners.
corner-radius = 0;

#################################
#     Background-Blurring
#################################

# Blur background of semi-transparent / ARGB windows.
blur-background = false;

#################################
#       General Settings
#################################

# Specify the backend to use: `xrender`, `glx`, or `xr_glx_hybrid`.
# `xrender` is the default one.
#
# backend = "glx"
mark-wmwin-focused = true;

# Mark override-redirect windows that doesn't have a child window with 'WM_STATE' focused.
mark-ovredir-focused = true;

# Try to detect WM windows (a non-override-redirect window with no
# child that has 'WM_STATE') and mark them as active.
detect-client-leader = true;

# Window type settings
#
# 'WINDOW_TYPE' is one of the 15 window types defined in EWMH standard:
#     "unknown", "desktop", "dock", "toolbar", "menu", "utility",
#     "splash", "dialog", "normal", "dropdown_menu", "popup_menu",
#     "tooltip", "notification", "combo", and "dnd".

shadow-exclude = [
  "window_type = 'menu'",
  "window_type = 'popup'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "window_type = 'utility'"
];

rounded-corners-exclude = [
  "window_type = 'menu'",
  "window_type = 'popup'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "window_type = 'utility'"
];

blur-background-exclude = [
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'popup'",
  "window_type = 'dropdown_menu'"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = true; clip-shadow-above = true; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 1.0; }
  dropdown_menu = { opacity = 1.0; }
};
