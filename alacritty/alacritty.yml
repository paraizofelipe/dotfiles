colors:
  bright:
    black: "#928374"
    blue: "#83a598"
    cyan: "#8ec07c"
    green: "#b8bb26"
    magenta: "#d3869b"
    red: "#fb4934"
    white: "#ebdbb2"
    yellow: "#fabd2f"

  normal:
    black: "#282828"
    blue: "#458588"
    cyan: "#689d6a"
    green: "#98971a"
    magenta: "#b16286"
    red: "#cc241d"
    white: "#a89984"
    yellow: "#d79921"

  primary:
    background: "#1d2021"
    foreground: "#ebdbb2"

  draw_bold_text_with_bright_colors: true

env:
  TERM: xterm-256color

font:
  size: 9

  bold:
    family: Hack Nerd Font
    style: Bold

  bold_italic:
    family: Hack Nerd Font
    style: Bold Italic

  italic:
    family: Hack Nerd Font
    style: Italic

  normal:
    family: Hack Nerd Font
    style: Regular

  offset:
    x: 0
    y: -1

scrolling:
  history: 5000

shell:
  program: /usr/bin/zsh

window:
  title: Alacritty
  opacity: 1.0

  class:
    general: Alacritty
    instance: Alacritty

  padding:
    x: 4
    y: 4
