[global/wm]
;https://github.com/jaagr/polybar/wiki/Configuration#global-wm-settings
margin-top = 0
margin-bottom = 0

[settings]
;https://github.com/jaagr/polybar/wiki/Configuration#application-settings
pseudo-transparency = true
thrformat-prefix = ""
throttle-output-for = 10
screenchange-reload = true
compositing-background = over
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

; Define fallback values used by all module formats
; format-underline = #fff
; format-foreground = #FF0000
; format-background = #00FF00
; format-overline =
; format-spacing =
; format-padding =
; format-margin =
; format-offset =

[colors]
background = #32302f
background-alt = #1d2021
; foreground = #c5c8c6
foreground = #ebdbb2
primary = #a89984
secondary = #83a598
alert = #cc241d
disabled = #3c3836

gb-red = #cc241d
gb-red-2 = #fb4934
gb-green = #98971a
gb-green-2 = #b8bb26
gb-yellow = #d79921
gb-yellow-2 = #fabd2f
gb-blue = #458588
gb-blue-2 = #83a598
gb-purple = #b16286
gb-purple-2 = #d3869b
gb-aqua = #689d6a
gb-aqua-2 = #8ec07c
gb-gray = #a89984
gb-gray-2 = #d5c4a1
gb-orange = #d65d0e
gb-orange-2 = #fe8019

; background = #282A2E
; background-alt = #373B41
; foreground = #C5C8C6
; primary = #F0C674
; secondary = #8ABEB7
; alert = #A54242
; disabled = #707880

[module/i3]
;https://github.com/jaagr/polybar/wiki/Module:-i3
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = false
enable-click = true
enable-scroll = true
wrapping-scroll = false
reverse-scroll = false
fuzzy-match = false

;extra icons to choose from
;http://fontawesome.io/cheatsheet/

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default = " "

; Available tags:
;   <label-state> (default) - gets replaced with <label-(focused|unfocused|visible|urgent)>
;   <label-mode> (default)
format = <label-state> <label-mode>


label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = #000000
label-mode-background = #FFBB00

; Available tokens:
;   %name%
;   %icon%
;   %index%
;   %output%
; Default: %icon%  %name%
; focused = Active workspace on focused monitor
label-focused = %icon% %name%
label-focused-background = ${colors.background}
label-focused-foreground = ${colors.foreground}
; label-focused-underline = ${colors.primary}
label-focused-underline = ${colors.gb-gray}
label-focused-padding = 1
label-focused-margin-right = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
; unfocused = Inactive workspace on any monitor
label-unfocused = %icon% %name%
label-unfocused-padding = 1
label-unfocused-background = ${colors.background}
label-unfocused-foreground = ${colors.foreground}
label-unfocused-underline =
label-unfocused-margin-right = 1

; visible = Active workspace on unfocused monitor
label-visible = %icon% %name%
label-visible-background = ${self.label-focused-background}
label-visible-underline = ${self.label-focused-underline}
label-visible-padding = 1
label-visible-margin-right = 1

; Available tokens:
;   %name%
;   %icon%
;   %index%
; Default: %icon%  %name%
; urgent = Workspace with urgency hint set
label-urgent = %icon% %name%
label-urgent-background = ${self.label-focused-background}
label-urgent-foreground = #db104e
label-urgent-padding = 1
label-urgent-margin-right = 1

format-foreground = ${colors.foreground}
format-background = ${colors.background}

#####################################################################################################

[bar/mainbar-i3]
; monitor = ${env:MONITOR:DP-1}
monitor = DP-1
width = 100%
height = 20pt
radius = 0
bottom = false

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = #000000

border-size = 1pt
border-color = ${colors.background}

padding-left = 1pt
padding-right = 1pt

module-margin-left = 1
module-margin-right = 0

module-margin = 1

separator = " "
separator-foreground = ${colors.disabled}

font-0 = Hack Regular Nerd Font Complete:fontformat=truetype:size=9;2
font-1 = Hack Regular Nerd Font Complete:fontformat=truetype:size=16;3
font-2 = "Font Awesome 5 Free:style=Regular:pixelsize=10;1"
font-3 = "Font Awesome 5 Free:style=Solid:pixelsize=10;1"
font-4 = "Font Awesome 5 Brands:pixelsize=10;1"

modules-left = launcher i3 xwindow
; modules-left = launcher i3 polywins
modules-center = notify-center date
; modules-right =  temperature pulseaudio filesystem memory cpu xkeyboard
modules-right = pulseaudio  xkeyboard vial agents wlan bluetooth opendeck netskope power

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right
; tray-detached = false
; tray-maxsize = 12
; tray-background = ${colors.background}
; tray-offset-x = 0
; tray-offset-y = 0
; tray-padding = 1
; tray-scale = 1.0
tray-position = none

