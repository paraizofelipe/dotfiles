[module/polywins]
type = custom/script
exec = ~/.config/polybar/polywins.sh 2>/dev/null
format = <label>
label = %output%
label-padding = 1
tail = true

#####################################################################################################

[module/notify-center]
type = custom/script
exec = ~/.config/polybar/oasis-station-status.sh
tail = true
click-left = ~/.local/bin/oasis-notify station

#####################################################################################################

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

#####################################################################################################

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%
format-underline =
format-foreground = #7c6f64

#####################################################################################################

[module/temperature]
;https://github.com/jaagr/polybar/wiki/Module:-temperature
type = internal/temperature
; Thermal zone to use
; To list all the zone types, run
; $ for i in /sys/class/thermal/thermal_zone*; do echo "$i: $(<$i/type)"; done
; Default: 0
; thermal_zone1 = x86_pkg_temp (CPU Package Temperature)
thermal-zone = 1

; Full path of temperature sysfs path
; Use `sensors` to find preferred temperature source, then run
; $ for i in /sys/class/hwmon/hwmon*/temp*_input; do echo "$(<$(dirname $i)/name): $(cat ${i%_*}_label 2>/dev/null || echo $(basename ${i%_*})) $(readlink -f $i)"; done
; to find path to desired file
; Default reverts to thermal zone setting
; hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon4/temp1_input
; Comentado: usando thermal-zone ao invés de hwmon-path para evitar problemas após reiniciar

warn-temperature = 90
format = <ramp> <label>
format-foreground = ${colors.foreground}
; format-underline = #c72581
format-warn = <ramp> <label-warn>
format-warn-underline = #c7254f
label = %temperature%
label-warn =  %temperature%
label-warn-foreground = #c7254f

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
; ramp-foreground = #c72581

#####################################################################################################

[module/filesystem]
;https://github.com/jaagr/polybar/wiki/Module:-filesystem
type = internal/fs

; Mountpoints to display
mount-0 = /
mount-1 = /home
;mount-2 = /var

; Seconds to sleep between updates
; Default: 30
interval = 30

; Display fixed precision values
; Default: false
fixed-values = false

; Spacing between entries
; Default: 2
spacing = 4

; Available tags:
;   <label-mounted> (default)
;   <bar-free>
;   <bar-used>
;   <ramp-capacity>
format-mounted = <label-mounted>
; format-mounted-foreground = ${colors.foreground}
; format-mounted-background = ${colors.background}
; format-mounted-underline = ${colors.gb-blue}


; Available tokens:
;   %mountpoint%
;   %type%
;   %fsname%
;   %percentage_free%
;   %percentage_used%
;   %total%
;   %free%
;   %used%
; Default: %mountpoint% %percentage_free%%
label-mounted = %{F} %mountpoint% %{F-} %percentage_used%%

; Available tokens:
;   %mountpoint%
; Default: %mountpoint% is not mounted
label-unmounted = %mountpoint% not mounted
format-unmounted-foreground = ${colors.foreground}
format-unmounted-background = ${colors.background}

;format-unmounted-underline = ${colors.alert}
; type = internal/fs
; interval = 25
;
; mount-0 = /
;
; label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%
;
; label-unmounted = %mountpoint% not mounted
; label-unmounted-foreground = ${colors.disabled}

#####################################################################################################

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume = <label-volume>
; format-volume-prefix-foreground = ${colors.gb-purple}
; format-volume-underline = ${colors.gb-purple}

label-volume = %percentage%%
label-muted =  0%
label-muted-foreground = ${colors.gb-red-2}

click-left = ~/.config/polybar/volume-control.sh
click-right = pavucontrol

#####################################################################################################

[module/volume-custom]
type = custom/script
exec = ~/.config/polybar/volume-display.sh
tail = true
click-left = ~/.config/polybar/volume-slider-zenity.sh &
click-right = pavucontrol &
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

#####################################################################################################

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

format-prefix = " "
; format-prefix-foreground = ${colors.gb-orange}
format-prefix-background = ${colors.background}
; format-prefix-underline = ${colors.gb-orange}
format-foreground = ${colors.foreground}
format-background = ${colors.background}

label-layout = %layout%
; label-layout-underline = ${colors.gb-orange}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-background = ${colors.background}
label-indicator-underline = ${colors.foreground}

#####################################################################################################

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
; format-prefix-foreground = ${colors.gb-yellow}
; format-underline = ${colors.gb-yellow}
